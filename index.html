<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마비노기 브리레흐 구슬 분배 계산기(부꺼조)">
  <title>브리레흐 구슬 분배 계산기(부꺼조)</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <h1>브리레흐 구슬 분배 계산기(부꺼조)</h1>
      <p>릴별 구슬 수와 인원 변동을 기록한 뒤 마지막에 한 번에 정산합니다.</p>
    </header>

    <section class="settings-card">
      <div class="field-block">
        <label for="orbPrice">구슬 단가</label>
        <div class="inline-input price-input">
          <input
            id="orbPrice"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            value="300000"
          >
          <span>골드</span>
        </div>
        <div id="orbPriceReadable" class="readable-gold">35만 골드</div>
      </div>

      <label class="guest-option">
        <input id="guestMode" type="checkbox">
        <span>
          <strong>구슬 구매자는 손님(눕클)</strong>
          <small>체크 시 구매자 본인은 모든 릴의 분배 대상에서 제외됩니다.</small>
        </span>
      </label>
    </section>

    <section class="orb-progress-card">
      <div class="field-block">
        <label for="currentOrbCount">현재 보유중인 구슬 갯수</label>
        <div class="inline-input">
          <input
            id="currentOrbCount"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            value="0"
          >
          <span>개</span>
        </div>
      </div>

      <div class="field-block">
        <label for="targetOrbCount">목표 구슬 갯수</label>
        <div class="inline-input">
          <input
            id="targetOrbCount"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            placeholder="예: 1200"
          >
          <span>개</span>
        </div>
      </div>
      <p class="hint">개인상자에서 획득하는 구슬은 1관당 1개씩 자동으로 보유 구슬에 반영됩니다.</p>
    </section>

    <div id="runsContainer"></div>

    <div class="main-actions">
      <button id="addRunBtn" type="button" class="secondary-button large-button">
        + 다음 릴 추가
      </button>
      <button id="calcBtn" type="button" class="primary-button large-button">
        분배금 계산
      </button>
    </div>

    <section id="resultsSection" class="results-section" hidden>
      <div class="results-header">
        <div>
          <h2>분배 결과</h2>
          <p>최종 개인별 누적 금액에서 1만 골드 미만을 버린 금액입니다.</p>
        </div>
        <button id="discordCopyBtn" type="button" class="discord-copy-button">
          디스코드용 정산문 복사
        </button>
      </div>
      <div id="resultsContainer"></div>
    </section>

    <footer class="page-footer">
      <p>입찰 사고 체크는 기록용이며 계산에는 영향을 주지 않습니다.</p>
    </footer>
  </main>

  <script src="script.js?v=8"></script>
</body>
</html>
